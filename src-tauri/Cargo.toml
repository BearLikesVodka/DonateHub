[package]
name = "donatehub"
description = "DonateHub: OBS donation goal for DonationAlerts + DonateX"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
donatehub-core = { path = "../crates/core" }
serde_json = "1.0.154"
tauri = "2.12.7"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build = "2.7.6"
