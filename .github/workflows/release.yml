name: Release

# A tag vX.Y.Z builds the Windows installer and the Linux AppImage into a DRAFT release with latest.json.
# The draft is published by hand after checking it on Windows 10/11 (see README, «Выпуск версии»).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "DonateHub $GITHUB_REF_NAME" --notes "$(cat <<'EOF'
          **Windows 10/11:** скачайте `DonateHub_*_x64-setup.exe` и запустите. Установщик без подписи Microsoft, поэтому Windows покажет «Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае».

          **Linux:** скачайте `DonateHub_*_amd64.AppImage`, сделайте файл исполняемым и запустите.

          Установленная программа дальше обновляется сама: в окне настроек появится плашка «Доступна версия…».
          EOF
          )"
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      # One at a time: both jobs update the same latest.json in the release.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-22.04 # old glibc, so the AppImage runs on older distributions too
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev file

      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
