[project]
name = "donation-goal"
version = "0.1.0"
description = "OBS donation goal overlay for DonationAlerts + DonateX"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "websockets",
    "PySide6-Essentials>=6.12",
    "PySide6-WebEngine>=6.12",
]

[project.scripts]
donation-goal = "donation_goal.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
build = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/donation_goal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
